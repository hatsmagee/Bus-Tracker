# Render Blueprint — provisions the Hele-On Bus Tracker web service.
#
# To use: in Render dashboard → New → Blueprint → point at this repo.

services:
  - type: web
    name: heleon-bus-tracker
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: BACKUP_GITHUB_TOKEN
        sync: false
      - key: BACKUP_GITHUB_REPO
        sync: false
      - key: OPENSKY_CLIENT_ID
        sync: false
      - key: OPENSKY_CLIENT_SECRET
        sync: false
      # Self-development agent. Off by default; set AGENT_ENABLED=true to turn
      # on always-on research + gated auto-publish. See README → "Self-
      # development agent" for the full loop and safety model.
      - key: AGENT_ENABLED
        value: "false"
      - key: AGENT_AUTO_PUBLISH
        value: "true"
      # Batch enrichments: wait until this many items are staged before an
      # auto-publish (each publish triggers a redeploy). The tail is flushed
      # automatically when a cycle finds nothing new. Keeps deploys infrequent.
      - key: AGENT_PUBLISH_MIN
        value: "4"
      - key: AGENT_RESEARCH_INTERVAL
        value: "600000"
      - key: AGENT_GITHUB_TOKEN
        sync: false
      - key: AGENT_GITHUB_REPO
        sync: false
      - key: AGENT_GITHUB_BRANCH
        value: main
      - key: AIHORDE_API_KEY
        sync: false
      - key: RENDER_DEPLOY_HOOK
        sync: false
      - key: AGENT_ITEM_BUDGET
        value: "3"
      - key: AGENT_STALE_DAYS
        value: "90"
